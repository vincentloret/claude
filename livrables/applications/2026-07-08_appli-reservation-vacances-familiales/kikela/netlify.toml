[build]
  command = "npm run build"
  publish = ".next"
  # Le dépôt contient d'autres projets (Kikimange…) : on ne reconstruit Kikela que si son dossier a changé.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"
